<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#13203a"/>
      <stop offset="1" stop-color="#1c2e52"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="10" fill="#D91023"/>
  <rect y="620" width="1200" height="10" fill="#D91023"/>

  <!-- decoración: barras grandes tenues a la derecha -->
  <g opacity="0.10">
    <rect x="760"  y="300" width="70" height="260" rx="10" fill="#ffffff"/>
    <rect x="850"  y="220" width="70" height="340" rx="10" fill="#ffffff"/>
    <rect x="940"  y="340" width="70" height="220" rx="10" fill="#ffffff"/>
    <rect x="1030" y="180" width="70" height="380" rx="10" fill="#ffffff"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(80,86)">
    <rect width="104" height="104" rx="22" fill="#0e1626" stroke="#28385a" stroke-width="2"/>
    <rect x="22" y="30" width="16" height="52" rx="3" fill="#D91023"/>
    <rect x="44" y="20" width="16" height="62" rx="3" fill="#ffffff"/>
    <rect x="66" y="40" width="16" height="42" rx="3" fill="#60a5fa"/>
  </g>

  <text x="210" y="138" fill="#9fb3c8" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="2">OBSERVATORIO · PERÚ</text>

  <text x="80" y="270" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="bold">Empresas Públicas</text>
  <text x="80" y="346" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="bold">del Perú</text>
  <rect x="82" y="376" width="140" height="7" rx="3.5" fill="#D91023"/>

  <text x="80" y="436" fill="#aebccf" font-family="Helvetica, Arial, sans-serif" font-size="30">Transparencia · Finanzas · Contrataciones · Gestión pública</text>

  <!-- chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold">
    <rect x="80"  y="486" width="318" height="58" rx="29" fill="#16233a" stroke="#2a3a55"/>
    <text x="239" y="524" fill="#cfe0f0" text-anchor="middle">FONAFE + EPS regionales</text>
    <rect x="414" y="486" width="290" height="58" rx="29" fill="#16233a" stroke="#2a3a55"/>
    <text x="559" y="524" fill="#cfe0f0" text-anchor="middle">Contrataciones OCDS</text>
    <rect x="720" y="486" width="220" height="58" rx="29" fill="#16233a" stroke="#2a3a55"/>
    <text x="830" y="524" fill="#cfe0f0" text-anchor="middle">Datos abiertos</text>
  </g>

  <text x="80" y="596" fill="#6b7e96" font-family="Helvetica, Arial, sans-serif" font-size="25">unimauro.github.io/observatorio-fonafe</text>
</svg>
